name: CI

on:
  push:
    branches: [ "main", "entrega-intermediaria" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install pytest ruff requests

      - name: Lint
        run: |
          cd projeto-bootcamp
          ruff check .

      - name: Test
        run: |
          cd projeto-bootcamp
          pytest